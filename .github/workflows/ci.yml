name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Một lần deploy tại một thời điểm; push mới hủy lần chạy cũ còn dở
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_URL: https://agent-production-ba73.up.railway.app

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy thật, test_bonus_cicd kiểm tra chính workflow này
      # → không chạy trong CI. Test cần Docker được chạy ở job build.
      - name: Run tests
        run: pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build & smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Image size
        run: docker images day12-agent:ci --format '{{.Size}}'

      - name: Smoke test container
        run: |
          docker network create ci
          docker run -d --name redis --network ci redis:7-alpine
          docker run -d --name agent --network ci -p 8000:8000 \
            -e AGENT_API_KEY=ci-smoke \
            -e REDIS_URL=redis://redis:6379/0 \
            day12-agent:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/ready && break
            sleep 1
          done
          curl -fs http://localhost:8000/health
          curl -fs http://localhost:8000/ready
          test "$(docker exec agent id -u)" = "10001"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/ask \
            -H 'Content-Type: application/json' -d '{"question":"hi"}')
          test "$code" = "401"

      - name: Container logs
        if: always()
        run: docker logs agent || true

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    # Chỉ deploy khi push lên main — pull request không bao giờ deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.63.0

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service agent

      - name: Verify public URL
        run: |
          for i in $(seq 1 30); do
            curl -fs "$PUBLIC_URL/health" && break
            sleep 5
          done
          curl -fs "$PUBLIC_URL/ready"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_URL/ask" \
            -H 'Content-Type: application/json' -d '{"question":"hi"}')
          test "$code" = "401"
